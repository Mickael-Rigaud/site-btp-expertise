<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>La loupe s'arrete sur chaque batiment</title>
<style>
 body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f9;color:#262c42;
      display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px}
 .scene{width:min(760px,90vw);background:#fff;border-radius:18px;padding:20px 26px;
        box-shadow:0 12px 40px rgba(38,44,66,.10)}
 .scene.sombre{background:#1a1f30}
 .logo-anime{width:100%;height:auto;display:block}
 .barre{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
 button{font:inherit;padding:9px 16px;border-radius:10px;border:1px solid #d5dae4;background:#fff;cursor:pointer}
 input[type=range]{width:240px}
</style></head><body>
<div class="scene" id="scene"><svg class="logo-anime" xmlns="http://www.w3.org/2000/svg"
     viewBox="-110 -110 1820 1700" role="img" aria-label="BTP Expertise">
  <defs>
    <style>
svg { --encre:#262c42; }
svg.sur-sombre { --encre:#ffffff; }
svg:not(.sur-sombre) .Ivar-sombre { display:none; }
svg.sur-sombre .Ivar-clair { display:none; }
svg.sur-sombre .Ireflet { opacity:.28; }

.Iesc   { opacity:0; transform:translate(-90px,34px);
         animation:Imonte .5s cubic-bezier(.2,.9,.25,1) var(--d) forwards; }
@keyframes Imonte { to { opacity:1; transform:translate(0,0); } }
.Icyan  { transform:translateY(880px); animation:Ipousse .9s cubic-bezier(.16,.85,.3,1) .45s forwards; }
.ItourO { transform:translateY(430px); animation:Ipousse .75s cubic-bezier(.16,.85,.3,1) .62s forwards; }
@keyframes Ipousse { to { transform:translateY(0); } }

.Iwipe     { transform:scaleX(0); transform-box:fill-box; transform-origin:0 0;
            animation:Iwipe 0.90s cubic-bezier(.3,.8,.2,1) 3.45s forwards; }
@keyframes Iwipe { to { transform:scaleX(1); } }
.Iwipe-inv { transform:translateX(0); transform-box:fill-box; transform-origin:0 0;
            animation:Iwipeinv 0.90s cubic-bezier(.3,.8,.2,1) 3.45s forwards; }
@keyframes Iwipeinv { to { transform:translateX(1600px); } }

.Ireflet { transform:translateX(-1500px);
          animation:Ireflet 5.2s cubic-bezier(.4,0,.3,1) 4.00s infinite; }
@keyframes Ireflet { 0%{transform:translateX(-1500px)} 22%{transform:translateX(600px)}
                    100%{transform:translateX(600px)} }

/* le contenu du verre recoit -K fois le deplacement de la Iloupe : c'est ce qui
   garde le grossissement cale sur le centre du verre a chaque instant */
.Iloupe, .Itroue { transform:translate(-440px,-40px);
                 animation:Ientre 3.00s cubic-bezier(.45,.05,.3,1) 0.35s forwards; }
@keyframes Ientre {
  0% { transform:translate(-440.0px,-40.0px); }
  16% { transform:translate(-215.0px,100.0px); }
  28% { transform:translate(-215.0px,100.0px); }
  44% { transform:translate(-20.0px,-70.0px); }
  56% { transform:translate(-20.0px,-70.0px); }
  72% { transform:translate(185.0px,85.0px); }
  84% { transform:translate(185.0px,85.0px); }
  100% { transform:translate(0.0px,0.0px); }
}
.Icontre { transform:translate(611.1px,55.6px);
          animation:Icontre 3.00s cubic-bezier(.45,.05,.3,1) 0.35s forwards; }
@keyframes Icontre {
  0% { transform:translate(611.1px,55.6px); }
  16% { transform:translate(298.6px,-138.9px); }
  28% { transform:translate(298.6px,-138.9px); }
  44% { transform:translate(27.8px,97.2px); }
  56% { transform:translate(27.8px,97.2px); }
  72% { transform:translate(-256.9px,-118.1px); }
  84% { transform:translate(-256.9px,-118.1px); }
  100% { transform:translate(-0.0px,-0.0px); }
}
</style>

<div class="barre">
  <button onclick="rejouer()">Rejouer</button>
  <button onclick="vitesse(.5)">Ralenti</button>
  <button onclick="vitesse(1)">Vitesse normale</button>
  <button onclick="document.getElementById('scene').classList.toggle('sombre');svg.classList.toggle('sur-sombre')">Fond sombre</button>
</div>
<div class="barre">
  <label>Parcourir : <input type="range" id="curseur" min="0" max="6000" value="6000" step="10" oninput="seek(this.value)"></label>
  <span id="tlabel">6.00 s</span>
</div>
<script>
const svg=document.querySelector('.logo-anime');
function anims(){return svg.getAnimations({subtree:true});}
function rejouer(){anims().forEach(a=>{a.cancel();a.play();});}
function vitesse(v){anims().forEach(a=>a.playbackRate=v);}
function seek(ms){ms=+ms;document.getElementById('tlabel').textContent=(ms/1000).toFixed(2)+' s';
  anims().forEach(a=>{a.pause();a.currentTime=ms;});}
const q=new URLSearchParams(location.search);
if(q.has('sombre')){document.getElementById('scene').classList.add('sombre');svg.classList.add('sur-sombre');}
if(q.has('t')){addEventListener('load',()=>{seek(+q.get('t'));
  document.querySelectorAll('.barre').forEach(e=>e.style.display='none');});}
</script></body></html>
